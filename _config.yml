# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Ascend Log
subtitle: 愿此行，终抵群星
description: 我的第一个博客，谱写生活的点滴
keywords:
author: 君名miku
language: zh-CN
timezone: Asia/Shanghai

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://Miku523.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: false # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang

# 404 页面为独立 HTML，跳过渲染原样输出（GitHub Pages 识别根目录 404.html）
skip_render: 404.html

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# 文章头图（由 scripts/banner.js 读取，无需安装组件）
# 单篇文章：在文章 front-matter 里写 banner: /images/xxx.jpg 即可指定头图
# 全站默认：下面 default 填一张图后，未单独指定 banner 的文章会自动使用它
banner:
  default: # 例 /images/banner-default.jpg（留空 = 不启用默认头图）

# RSS 订阅（hexo-generator-feed）
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20        # 最多输出 20 篇，0 = 全部
  content: true    # 输出全文
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date
  icon: icon.png   # 留空则不输出图标

# 文章加密（hexo-blog-encrypt）
# 用法：在文章 front-matter 加 password: 你的密码
# 可选：message: 提示语  |  wrong_pass_message: 密码错误提示  |  abstract: 加密前显示的摘要
encrypt:
  enable: true

# 站点地图（hexo-generator-sitemap）
sitemap:
  path: sitemap.xml
  rel: false
  tags: true   # 输出文章标签
  categories: true  # 输出文章分类

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: next

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: https://github.com/Miku523/Miku523.github.io.git
  branch: main
